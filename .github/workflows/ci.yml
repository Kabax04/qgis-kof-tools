name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 is not available for ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = QGIS 3.22-3.28, 3.12 = QGIS 3.34+
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest flake8
      - run: python -m flake8 kof_tools tests scripts
      - run: python -m pytest

  qgis:
    # The tests that need QGIS (import and export algorithms, layers, drag
    # and drop) are skipped in the job above. Here they run in QGIS's own
    # Docker images: the oldest supported version and the newest ones.
    name: QGIS ${{ matrix.qgis }}
    runs-on: ubuntu-24.04
    container: qgis/qgis:${{ matrix.qgis }}
    strategy:
      fail-fast: false
      matrix:
        qgis: ["final-3_22_16", "ltr", "latest"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: python3 -m pytest --version || (apt-get update && apt-get install -y python3-pytest)
      - name: QGIS version
        run: python3 -c "from qgis.core import Qgis; print(Qgis.version())"
      # The release tests need the git history and run in the job above.
      - run: python3 -m pytest -v -rs --ignore=tests/test_release.py
